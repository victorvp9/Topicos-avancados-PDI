[project]
name = "topicos-avancados-pdi"
version = "0.1.0"
description = "Deteccao deterministica de eventos de futebol sob degradacao de visibilidade (Vidal-Codina et al., 2022)"
requires-python = ">=3.11"
dependencies = [
    # matplotlib so pelas figuras do `--tabelas-figuras` (plano 08 §3 e §5); na
    # pilha aprovada do CLAUDE.md; decisoes.md, "Fatia 8 — plano", 2026-11-05.
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    # pandas 3.0 e piso real, nao conveniencia: src/io/schema.py exige dtype
    # "str"; em pandas 2.x `astype("str")` devolve `object` e `validar()`
    # reprovaria as 4 tabelas.
    "pandas>=3.0",
    "pyyaml>=6.0",
    # scipy so por `optimize.linear_sum_assignment`: o casamento evento x
    # deteccao e atribuicao otima, nao gulosa (docs/fatias/02-plano.md §3).
    # Ja esta na pilha aprovada do CLAUDE.md. decisoes.md, G2 da Fatia 2.
    # O piso NAO vem da API, que existe desde o scipy 0.17: vem do ABI do
    # numpy 2.x que o `pandas>=3.0` implica. 1.13.1 e o mais antigo VERIFICADO
    # POR EXECUCAO SOB PYTHON 3.12 (54 testes do casador verdes com scipy
    # 1.13.1 + pandas 3.1.0 + numpy 2.2.6, em ambiente efemero
    # `uv run --isolated --no-project`). No Python 3.13 nao ha roda para o
    # 1.13.1 e o `uv` tentaria compilar: quem for para o 3.13 precisa subir o
    # piso. Versoes abaixo de 1.13.1 nao foram testadas.
    "scipy>=1.13.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# Projeto nao e pacote instalavel: `python -m src.run` roda da raiz do repo.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # projeto nao instalado: `src` vem da raiz do repo
